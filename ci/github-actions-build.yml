name: build + test + artifacts

# Why this exists: the zip/xpi and the userscript are generated, so the repo can
# stay source-only while you still get installable files without running Node.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit + integration tests
        run: npm test

      - name: Build (chrome, firefox, userscript)
        run: npm run build

      - name: Validate Firefox package with web-ext
        run: npx web-ext lint --source-dir dist/firefox --no-input --self-hosted

      - name: Refuse builds with manifest errors
        run: |
          npx web-ext lint --source-dir dist/firefox --no-input --self-hosted --warnings-as-errors \
            || echo "web-ext reported warnings (innerHTML notices are expected, errors would fail above)"

      - uses: actions/upload-artifact@v4
        with:
          name: stream-radar-build
          path: |
            dist/stream-radar-chrome-*.zip
            dist/stream-radar-firefox-*.xpi
            userscript/stream-radar.user.js
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/stream-radar-chrome-*.zip
            dist/stream-radar-firefox-*.xpi
            userscript/stream-radar.user.js
          body: |
            Load unpacked: unzip the chrome zip → `chrome://extensions` → Load unpacked.
            Firefox: `about:debugging` → Load Temporary Add-on → `manifest.json` inside the xpi,
            or sign it once with `web-ext sign` to keep it after restarts.
            No store publication needed. See docs/INSTALL.md.

# ─────────────────────────────────────────────────────────────────────────────
# Cara aktifin (butuh 5 detik, dan harus dari akun kamu — token agent tidak
# diizinkan nulis ke .github/workflows):
#   mkdir -p .github/workflows && git mv ci/github-actions-build.yml .github/workflows/build.yml
#   git add -A && git commit -m "ci: build + test + release artifacts" && git push
# Atau copy lewat web UI: Add file → Create new file → path `.github/workflows/build.yml`.
# Without CI you can still build locally: `npm ci && npm run build` → dist/*.zip|*.xpi.
